/* ------------------------------- Audio -------------------------------- */
let AC = null, muted = false, audioUnlocked = false;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (!AC) return;
  if (AC.state === "suspended") AC.resume();
  if (!audioUnlocked) {            // Safari/iOS: nudge the context awake inside a real tap
    try {
      const b = AC.createBuffer(1, 1, 22050);
      const s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
    } catch (e) {}
    audioUnlocked = true;
  }
  startMusic();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, cutoff) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol || 0.3;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 1400;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}

  smash:   () => { noiseBurst(0.18, 0.38, 1800); tone(180, 0.16, "sawtooth", 0.14, 80); },
  crash:   () => { noiseBurst(0.4, 0.45, 900); tone(160, 0.4, "sawtooth", 0.18, 50); },
  shoot:   () => tone(420, 0.06, "square", 0.08, 170),
  boom:    () => { noiseBurst(0.5, 0.5, 700); tone(120, 0.5, "sawtooth", 0.20, 40); },

/* ---- Kids' voice lines: real recordings of Lachlan calling the action ----
   Each line lives at audio/<name>.mp3 (Voice Memos exports are usually .m4a,
   so both extensions are probed). A missing file becomes a silent no-op, so
   lines can be recorded and dropped in one at a time — see
   tools/VOICE_LINES.md for the radio-chatter scripts. */
const VOICE = {
  _pool: {}, _missing: {}, _lastAt: {},
  _el(name) {
    const a = new Audio();
    a.addEventListener("error", () => {          // mp3 miss → try .m4a once, then give up quietly
      if (a.dataset.triedM4a) this._missing[name] = true;
      else { a.dataset.triedM4a = "1"; a.src = "audio/" + name + ".m4a"; }
    });
    a.src = "audio/" + name + ".mp3";
    return a;
  },
  play(name) {
    const now = performance.now() / 1000;
    if (this._lastAt[name] && now - this._lastAt[name] < 4) return;   // throttle same line within 4s
    if (muted || this._missing[name]) return;                         // master-mute aware / known-missing
    this._lastAt[name] = now;
    let a = this._pool[name];
    if (!a) { a = this._el(name); this._pool[name] = a; }
    try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} // autoplay rules: fail silently
  },
};

/* ---- Background music: a light looped melody synthesized in WebAudio ---- */
let musicTimer = null, musicStep = 0;
const MUSIC = {
  // gentle, breezy major loop (16 steps); 0 = rest
  normal: [392, 0, 523, 587, 659, 0, 587, 523, 440, 0, 523, 392, 330, 0, 392, 0],
  // tenser, lower minor loop for boss fights
  boss:   [330, 392, 330, 294, 349, 294, 262, 311, 247, 294, 247, 196, 233, 196, 175, 0],
};
function musicNote(freq, dur, vol, type) {
  if (!AC || muted || !freq) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
function musicTick() {
  if (!AC || muted || state === STATE.OVER || state === STATE.WIN) return;   // quiet on the end screens
  const onBoss = bossActive;
  const pat = onBoss ? MUSIC.boss : MUSIC.normal;
  musicNote(pat[musicStep % pat.length], onBoss ? 0.16 : 0.22, 0.05);        // melody, sits under the SFX
  if (musicStep % 4 === 0) musicNote(onBoss ? 98 : 131, 0.34, 0.06, "sine"); // bass on the downbeat
  musicStep++;
}
function startMusic() { if (!musicTimer) musicTimer = setInterval(musicTick, 205); }

let W = 0, H = 0, DPR = 1;
let isPortrait = false;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  isPortrait = W / H < 0.82;
  initAmbient();
}
window.addEventListener("resize", resize);

let whatsNewOpen = false, whatsNewScroll = 0, whatsNewScrollMax = 0, whatsNewDragY = null;
/* ---- Ghost Replay Races ------------------------------------------------
   Every run quietly records the pilot's flight path (~8 samples a second,
   capped at ~3 minutes) while it happens — boss fights included. Finish a
   run with a new best score for that world and the path is saved, so later
   runs can race a translucent "ghost" of that best flight. Each sample is
   [t_ms, x‰ of W, y‰ of H, pitch in centiradians]: rounded ints keep the
   payload lean, and per-mille coordinates let a ghost recorded at one window
   size replay correctly at another. */
const GHOST_SAMPLE_DT = 0.08;       // seconds between recorded samples
const GHOST_SAMPLE_MAX = 2400;      // hard cap ≈ 3 min of flight, then recording just stops
let runT = 0;                       // unpaused seconds flown THIS run (the shared ghost clock)
let lastRecT = 0;                   // run-clock time of the most recent sample
let ghostRec = [];                  // this run's samples while it records
let ghostRun = null;                // ghost racing this run {score, samples, ptr, beat}
let racePending = false;            // RACE tapped on game-over → next reset() loads the ghost
let ghostStored = {};               // per-world cache of saved ghosts (spare localStorage reads)
let ghostClearArmedAt = 0;          // CLEAR button double-tap confirm timestamp
let ghostStripCache = null;         // { src, cv } navy-tinted hero strip, built once

best = parseInt(localStorage.getItem("ipcf_best") || "0", 10) || 0;
// persisted world progress: 0 = none cleared, 3 = all bosses beaten
let worldsCleared = clamp(parseInt(localStorage.getItem("ipcf_worlds") || "0", 10) || 0, 0, 3);
if (!worldsCleared && localStorage.getItem("ipcf_world1_cleared")) worldsCleared = 1;  // migrate old flag
let currentWorld = 1;
const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ambient particle pools (created on resize) */
let stars = [], flakes = [];
function initAmbient() {
  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: rand(0, W), y: rand(0, H * 0.8), r: rand(0.6, 2.2), p: rand(0, 6.28) });
  flakes = [];
  for (let i = 0; i < 90; i++) flakes.push({ x: rand(0, W), y: rand(0, H), r: rand(1.5, 4), vx: rand(-0.04, 0.04), vy: rand(0.12, 0.28), p: rand(0, 6.28) });
}

function reset() {
  player = { x: W * CONFIG.playerX, y: H * 0.45, vx: 0, vy: 0, angle: 0 };
  rings = []; fish = []; powerups = []; birds = []; gusts = []; particles = []; texts = [];
  missionItems = []; friendlyShots = [];
  speed = CONFIG.startSpeed;
  score = 0; passed = 0; bgX = 0; holding = false; shakeT = 0; propAngle = 0;
  steeringLeft = steeringRight = false; leftTouchId = rightTouchId = null; flightTouchIds.clear();
  combo = 0; lastScoreT = -99;
  starT = magnetT = slowT = graceT = 0; hasShield = false;
  bossActive = false; bossBeaten = false; bossPhase = 0; boss = null; shots = []; bossT = 0; bossShootCd = 0;
  bossPartsThrown = 0; diedAtBoss = false;
  level = 1; speedCap = CONFIG.maxSpeed; diedAtBossLevel = 1;
  panicT = 0; panicIdx = 0;
  tutorialStep = 0; tutorialT = 0;
  perfectStreak = 0; perfectTotal = 0; nearMissT = 0;
  approachT = 0; mapT = 0;
  bossAmmo = 0; bossSupplyCd = 3.5;
  trailAcc = 0; birdCooldown = H * 2; gustCooldown = H * 1.2;
  plush = null; climbAmt = 0; steerAxis = 0; keySteer = 0; kbHolding = false; keysDown.clear();
  // ghost races: every run records fresh; a ghost only rides along when RACE was tapped
  runT = 0; lastRecT = 0; ghostRec = []; ghostRun = null;
  if (racePending) {
    racePending = false;
    const g = loadGhost(currentWorld);   // each world races its own saved flight
    if (g) ghostRun = { score: g.score, samples: g.samples, ptr: 0, beat: false };
  }
  pairNext = false; nextSpacing = CONFIG.ringSpacing; lastGapY = 0.5;
  arena = 1;
  // sky starts fully on biome 0 (no pop-in)
  washCur = BIOMES[0].wash.slice(); darkCur = BIOMES[0].dark; starAmt = 0; snowAmt = 0; dustAmt = 0;
  lastBiome = 0; banner = ""; bannerT = 0;
  let x = W + W * 0.2;
  for (let i = 0; i < 3; i++) {
    const r = makeRing(x);
    if (i === 0) r.baseCy = r.cy = H * 0.50;
    if (i === 1) {
      r.baseCy = r.cy = H * 0.42;
      spawnFishLine(r.x, r.cy, H * 0.025);
    }
    if (i === 2) {
      r.baseCy = r.cy = H * 0.58;
      powerups.push({ x: r.x, y: r.cy, type: "shield", p: 0 });
    }
    rings.push(r); x += H * CONFIG.ringSpacing;
  }
}

function makeRing(x) {
  let cy;
  if (pairNext) {                              // partner ring of a pair: keep close
    cy = lastGapY + rand(-0.05, 0.05);
    pairNext = false;
  } else {
    cy = lastGapY + (Math.random() * 2 - 1) * CONFIG.gapWander;
  }
  cy = clamp(cy, 0.22, 0.78); lastGapY = cy;
  const r = { x, baseCy: cy * H, cy: cy * H, scored: false, smashed: false,
              phase: rand(0, 6.283), type: "static", driftAmp: 0, driftFreq: 0 };
  // drifting rings appear once you're warmed up, more often the deeper you go
  if (passed >= 8 && Math.random() < clamp((passed - 8) / 55, 0, 0.45)) {
    r.type = "drift"; r.driftAmp = H * rand(0.05, 0.12); r.driftFreq = rand(1.1, 2.1);
  }
  return r;
}

/* shared collectible spawners */
function pickFishType() {
  if (Math.random() < 0.12) return Math.random() < 0.5 ? 1 : 6;   // rare fancy fish
  const common = [0, 2, 3, 4, 5];
  return common[Math.random() * common.length | 0];
}
function spawnFishLine(x, cy, spread) {
  const n = 2 + (Math.random() * 3 | 0);       // 2–4 fish
  const type = pickFishType();                  // a school shares a type
  for (let i = 0; i < n; i++) {
    fish.push({
      x: x + (i - (n - 1) / 2) * H * 0.06,
      y: clamp(cy + (Math.random() * 2 - 1) * spread, H * 0.12, H * 0.88),
      p: rand(0, 6.28), type,
    });
  }
}
function maybeSpawnPower(x, cy) {
  if (passed >= 5 && Math.random() < 0.13) {
    const types = ["star", "magnet", "slow", "shield", "shield"];   // shield a bit more common (very useful)
    powerups.push({
      x, y: clamp(cy, H * 0.18, H * 0.82),
      type: types[Math.random() * types.length | 0], p: rand(0, 6.28),
    });
  }
}
/* attach fish + power-ups to a freshly spawned ring */
function attachItems(r) {
  const holeHalf = (H * CONFIG.ringHeight * RING.holeFrac) / 2;
  if (Math.random() < 0.72) spawnFishLine(r.x, r.cy, holeHalf * 0.55);
  maybeSpawnPower(r.x + H * CONFIG.ringSpacing * 0.5, r.cy + (Math.random() * 2 - 1) * H * 0.14);
  maybeSpawnPlush(r.x);   // the Dino Bob cameo rides the same ring cadence
}
/* Crossover collectible: Dino Bob's plush occasionally drifts through as a
   bonus (~5% per ring once you're past 30 points, never two at once). */
function maybeSpawnPlush(x) {
  if (score > 30 && !plush && Math.random() < 0.05) {
    plush = { x: x + H * CONFIG.ringSpacing * 0.5, baseY: rand(0.2, 0.8) * H, y: 0, p: rand(0, 6.283) };
  }
}
function haptic(ms) { if (!reducedMotion && navigator.vibrate) navigator.vibrate(ms); }
function pauseButtonRect() {
  const s = Math.max(48, H * 0.09);
  return { x: Math.max(12, H * 0.035), y: Math.max(12, H * 0.035), w: s, h: s };
}
function pauseButtonHit(px, py) {
  if (state !== STATE.PLAYING) return false;
  const b = pauseButtonRect();
  return px >= b.x - sHitPad() && px <= b.x + b.w + sHitPad() &&
         py >= b.y - sHitPad() && py <= b.y + b.h + sHitPad();
}
function sHitPad() { return Math.max(8, H * 0.015); }
function resumeButtonHit(px, py) {
  const r = Math.max(68, H * 0.12), cx = W / 2, cy = H / 2 + H * 0.085;
  return Math.hypot(px - cx, py - cy) <= r * 1.22;
}
/* [PHOTO] entry button on the pause overlay — top-right corner pill,
   mirroring the pause button's geometry and the What's New chip styling. */
function photoBtnRect() {
  const s = Math.max(48, H * 0.09), pad = Math.max(12, H * 0.035);
  return { x: W - pad - s * 1.7, y: pad, w: s * 1.7, h: s };
}
function photoBtnHit(px, py) {
  const b = photoBtnRect();
  return px >= b.x - sHitPad() && px <= b.x + b.w + sHitPad() &&
         py >= b.y - sHitPad() && py <= b.y + b.h + sHitPad();
}
function requestFrame() {
  if (!rafId && (!paused || photoMode)) rafId = requestAnimationFrame(frame);   // photo mode keeps frames alive while paused
}
function cancelFrame() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}
function setPaused(next) {
  next = !!next;
  if (state !== STATE.PLAYING || isPortrait) return paused;
  if (paused === next) return paused;
  paused = next;
  holding = false; steeringLeft = false; steeringRight = false;
  kbHolding = false; keysDown.clear(); keySteer = 0; gpClimb = 0; gpSteer = 0;   // drop every input source
  flightTouchIds.clear(); leftTouchId = rightTouchId = null;
  if (paused) {
    cancelFrame();
    drawPauseOverlay();
  } else {
    last = performance.now();
    requestFrame();
  }
  return paused;
}
/* per-world approach: seconds of flight before that world's boss shows up */
function worldTime(n) { return n >= 3 ? CONFIG.world3Time : n === 2 ? CONFIG.world2Time : CONFIG.world1Time; }
/* how far along this world's approach we are (0..1) — drives the boss meter + cloud darkening */
function approachFrac() { return clamp(approachT / worldTime(level), 0, 1); }
/* set up a world's speed/arena, used by both the world select and boss retry */
function applyWorldConfig(n) {
  currentWorld = n; level = n;
  if (n >= 3)      { arena = 4; speedCap = CONFIG.level3SpeedCap; speed = CONFIG.startSpeed * 1.55; }
  else if (n === 2){ arena = 3; speedCap = CONFIG.level2SpeedCap; speed = CONFIG.startSpeed * 1.45; }
}
function startWorld(n) {
  reset(); applyWorldConfig(n);
  state = STATE.PLAYING; holding = true;
  tutorialT = n === 1 ? 5 : 0;
  banner = n === 2 ? "WORLD 2 — THE STORM RUN!" : n >= 3 ? "WORLD 3 — DREADNOUGHT SKIES!" : "";
  bannerT = banner ? 3.2 : 0;
  SFX.flap();
}
/* clouds start light and darken as the boss approaches (cloud_0..8) */
function cloudTier() { return clamp(Math.floor(approachFrac() * (ASSETS.clouds.length - 1)), 0, ASSETS.clouds.length - 1); }
/* a gust cloud hazard in the Dusty Hills */
function makeGust(x, yf) {
  return { x, baseY: yf * H, y: yf * H, r: H * rand(0.075, 0.105), p: rand(0, 6.28), scored: false, cloud: cloudTier() };
}

/* ------------------------------- Input -------------------------------- */
function fireFriendlyShot() {
  if (!bossActive || bossAmmo <= 0) return;
  bossAmmo--;
  friendlyShots.push({ x: player.x + H*.08, y: player.y, vx: H*1.28, r: H*.028, p: 0 });
  SFX.shoot(); haptic(18);
}
function directionButtons() {
  const r=H*.066, cy=H*.82;
  return { left:{x:H*.095,y:cy,r}, right:{x:H*.245,y:cy,r} };
}
// Big dedicated FIRE button (bottom-right) — only live during a boss fight. Lets you
// HOLD your ice fish and shoot on purpose, instead of every climb-tap dumping a shot.
function fireButton(){ const r=H*.082; return { x: W-H*.13, y: H*.80, r }; }
function fireHit(px,py){ if(!bossActive)return false; const b=fireButton(); return Math.hypot(px-b.x,py-b.y)<=b.r*1.2; }
function directionHit(px,py) {
  const d=directionButtons();
  if(Math.hypot(px-d.left.x,py-d.left.y)<=d.left.r*1.25)return "left";
  if(Math.hypot(px-d.right.x,py-d.right.y)<=d.right.r*1.25)return "right";
  return null;
}
function continueBossButtonRect(){const w=Math.min(W*.42,H*.62),h=H*.085;return{x:(W-w)/2,y:H*.68,w,h};}
function continueBossHit(px,py){const b=continueBossButtonRect();return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h;}
function continueBoss() {
  const retryLevel=diedAtBossLevel; // preserve this before reset() restores level one
  reset(); applyWorldConfig(retryLevel);
  approachT = worldTime(retryLevel);   // skip straight back to the fight
  state=STATE.PLAYING;startBoss(retryLevel);
}
function press(px, py) {
  audioInit();
  if (isPortrait) return;
  if (photoMode) { photoPress(px, py); return; }   // photo bar owns every tap while composing a shot
  if (paused) {
    if (px != null && photoBtnHit(px, py)) { enterPhotoMode(); return; }
    if (resumeButtonHit(px, py) || pauseButtonHit(px, py)) setPaused(false);
    return;
  }
  if (state === STATE.PLAYING && px != null && pauseButtonHit(px, py)) { setPaused(true); return; }
  if (state === STATE.STORY) {
    storyPage++;
    if (storyPage >= 3) { storyPage = 0; state = STATE.READY; localStorage.setItem("ipcf_story_seen", "1"); }
    else VOICE.play("story_" + (storyPage + 1));   // Lachlan narrates each page as it turns
  }
  else if (state === STATE.READY) {
    // world select: tap a card to fly that world; anywhere else = next world up
    if (px != null) {
      if (whatsNewOpen) {                          // changelog panel: only BACK responds
        if (whatsNewBackHit(px, py)) closeWhatsNew();
        return;
      }
      if (whatsNewChipHit(px, py)) { openWhatsNew(); return; }   // Ship Day ritual chip
      if (worldsCleared > 0) {
        const hit = worldCardHit(px, py);
        if (hit) { startWorld(hit); return; }
      }
    }
    startWorld(Math.min(worldsCleared + 1, 3));
  }
  else if (state === STATE.PLAYING) { holding = true; SFX.flap(); }
  else if (state === STATE.WIN && performance.now() - overAt > 350) { reset(); state = STATE.READY; }
  else if (state === STATE.OVER && performance.now() - overAt > 350) {
    if (diedAtBoss) { if(px==null||continueBossHit(px,py))continueBoss(); }
    else if (px != null && ghostButtonsHit(px, py)) { }   // RACE MY GHOST / CLEAR ate this tap
    else { reset(); state = STATE.READY; }
  }
}
function release() { holding = false; }

/* Tappable speaker icon (top-right). Returns true if the tap hit it, so a
   tap on the button toggles sound instead of making the penguin flap. */
function muteBtnHit(px, py) {
  const cx = W - H * 0.05, cy = H * 0.05, r = H * 0.07;
  return Math.abs(px - cx) < r && Math.abs(py - cy) < r;
}
function handleMuteTap(px, py) {
  if (paused) return false;   // speaker icon is hidden on the pause/photo overlays; keep the hitbox from eating [PHOTO] taps
  if (!muteBtnHit(px, py)) return false;
  audioInit();
  muted = !muted;
  return true;
}

canvas.addEventListener("mousedown", (e) => { e.preventDefault(); if (handleMuteTap(e.clientX, e.clientY)) return; if (fireHit(e.clientX, e.clientY)) { fireFriendlyShot(); return; } press(e.clientX, e.clientY); });
window.addEventListener("mouseup", () => release());
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(paused){press(t.clientX,t.clientY);continue;}
    if(handleMuteTap(t.clientX,t.clientY))continue;
    if(state===STATE.PLAYING&&fireHit(t.clientX,t.clientY)){fireFriendlyShot();continue;}
    const dir=state===STATE.PLAYING?directionHit(t.clientX,t.clientY):null;
    if(dir==="left"){leftTouchId=t.identifier;steeringLeft=true;continue;}
    if(dir==="right"){rightTouchId=t.identifier;steeringRight=true;continue;}
    flightTouchIds.add(t.identifier);press(t.clientX,t.clientY);
  }
}, { passive: false });
function endTouches(e){e.preventDefault();for(const t of e.changedTouches){if(t.identifier===leftTouchId){leftTouchId=null;steeringLeft=false;}if(t.identifier===rightTouchId){rightTouchId=null;steeringRight=false;}flightTouchIds.delete(t.identifier);}if(!flightTouchIds.size)release();}
window.addEventListener("touchend",endTouches,{passive:false});
window.addEventListener("touchcancel",endTouches,{passive:false});
window.addEventListener("keydown", (e) => {
  if (whatsNewOpen && e.code === "Escape") { e.preventDefault(); closeWhatsNew(); return; }
  if (paused) {
    if (photoMode) {   // Esc / P back out of photo mode first, to normal pause
      if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); exitPhotoMode(); }
      return;
    }
    if (e.code === "KeyP" || e.code === "Escape" || e.code === "Space" || e.code === "Enter") { e.preventDefault(); setPaused(false); }
    return;
  }
  if (state === STATE.PLAYING && (e.code === "KeyP" || e.code === "Escape")) { e.preventDefault(); setPaused(true); return; }
  // Space/ArrowUp share the touch path's climb signal; kbHolding keeps keyboard
  // climb alive even if a finger lifts elsewhere (release() only owns `holding`)
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (!e.repeat && !kbHolding) { kbHolding = true; press(); } }
  if(e.code==="ArrowLeft"){e.preventDefault();keysDown.add("L");steeringLeft=true;}
  if(e.code==="ArrowRight"){e.preventDefault();keysDown.add("R");steeringRight=true;}
  if ((e.code === "KeyF" || e.code === "Enter") && state === STATE.PLAYING && !e.repeat) { e.preventDefault(); fireFriendlyShot(); }
  if (e.code === "KeyM") { muted = !muted; }
  // R on the game-over screen = full restart from zero (vs. tap = retry the boss)
  if (e.code === "KeyR" && state === STATE.OVER) { reset(); state = STATE.READY; }
  // 1/2/3 on the title = fly straight into that world (if unlocked)
  if (state === STATE.READY && /^Digit[123]$/.test(e.code)) {
    const n = Number(e.code.slice(5));
    if (n <= worldsCleared + 1) { e.preventDefault(); startWorld(n); }
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); kbHolding = false; release(); }
  if(e.code==="ArrowLeft"){keysDown.delete("L");steeringLeft=false;}
  if(e.code==="ArrowRight"){keysDown.delete("R");steeringRight=false;}
});

/* --- Gamepad polling + the merged-input mixer ----------------------------
   Runs once per frame (cheap). Sticks are deadzone-remapped to a 0..1 analog
   strength; A (button 0) fires on the press edge only; Start (button 9)
   toggles pause. Everything funnels into climbAmt / steerAxis below so
   touch, keyboard, and pad can all be held at once and simply combine. */
function dz(v) {   // deadzone → remapped analog strength (full throw still = full strength)
  const a = Math.abs(v), s = v < 0 ? -1 : 1;
  return a < 0.35 ? 0 : s * Math.min(1, (a - 0.35) / 0.65);
}
function pollGamepad() {
  gpClimb = 0; gpSteer = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p || !p.connected) continue;
    gpSteer = clamp(gpSteer + dz(p.axes[0] || 0), -1, 1);    // left stick X → steering
    gpClimb = Math.max(gpClimb, dz(-(p.axes[1] || 0)));      // stick up → climb (scaled by tilt)
    const fire = !!(p.buttons[0] && p.buttons[0].pressed);   // A = FIRE bolt (edge, respects ammo)
    if (fire && !gpFirePrev && state === STATE.PLAYING && !paused) fireFriendlyShot();
    gpFirePrev = fire;
    const start = !!(p.buttons[9] && p.buttons[9].pressed);  // Start = pause toggle (edge)
    if (start && !gpStartPrev && state === STATE.PLAYING) {
      if (photoMode) exitPhotoMode();        // Start inside photo mode exits the camera first
      else setPaused(!paused);
    }
    gpStartPrev = start;
  }
}
function pollInputs(dt) {
  pollGamepad();
  // keyboard arrows ease toward ±1 for an analog feel, then settle back to 0
  const kt = (keysDown.has("R") ? 1 : 0) - (keysDown.has("L") ? 1 : 0);
  keySteer += (kt - keySteer) * Math.min(1, dt * 9);
  if (!kt && Math.abs(keySteer) < 0.02) keySteer = 0;
  // final merge: digital buttons win ties, analog sources stack underneath
  climbAmt = Math.max((holding || kbHolding) ? 1 : 0, gpClimb);
  steerAxis = clamp((steeringRight ? 1 : 0) - (steeringLeft ? 1 : 0) + keySteer + gpSteer, -1, 1);
}
// tiny toast when a controller pairs in (drawn by the floating-text system)
window.addEventListener("gamepadconnected", () => {
  texts.push({ x: W / 2, y: H * 0.3, str: "\uD83C\uDFAE Controller connected!", color: "#7fd0ff", scale: 1.1, life: reducedMotion ? 1.6 : 2.2, max: 2.2 });
});
window.addEventListener("gamepaddisconnected", () => {
  gpFirePrev = gpStartPrev = false;
  texts.push({ x: W / 2, y: H * 0.3, str: "\uD83C\uDFAE Controller bye!", color: "#9fb6d8", scale: 1, life: 1.6, max: 1.6 });
});
// belt-and-suspenders: any interaction anywhere keeps the audio context awake
["pointerdown", "touchstart", "keydown"].forEach((ev) =>
  window.addEventListener(ev, audioInit));

/* ----------------------------- scoring -------------------------------- */
function addScore(base, x, y) {
  const now = performance.now() / 1000;
  combo = (now - lastScoreT < CONFIG.comboWindow) ? Math.min(combo + 1, 9) : 1;
  lastScoreT = now;
  const gain = base * combo;
  score += gain;
  addText(x, y, "+" + gain, combo > 1 ? "#ffd34d" : "#ffffff", combo > 1 ? 1.25 : 1);
  if (combo > 1) SFX.combo(combo);
  return gain;
}
function addText(x, y, str, color, scale) {
  texts.push({ x, y, str, color, scale: scale || 1, life: 0.9, max: 0.9 });
}

/* ----------------------------- particles ------------------------------ */
function burst(kind, x, y, n, opts) {
  opts = opts || {};
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), sp = rand(opts.spMin || 0.1, opts.spMax || 0.5) * H;
    particles.push({
      kind, x, y,
      vx: Math.cos(a) * sp + (opts.vx || 0), vy: Math.sin(a) * sp + (opts.vy || 0),
      life: rand(opts.lifeMin || 0.4, opts.lifeMax || 0.8),
      max: 0.8, rot: rand(0, 6.28), vr: rand(-8, 8),
      size: rand(opts.sMin || 0.012, opts.sMax || 0.03) * H,
      color: opts.color || "#fff", grav: opts.grav == null ? 1.4 : opts.grav,
    });
  }
}

/* ------------------------------- Update ------------------------------- */
function gameOver() {
  diedAtBoss = bossActive; diedAtBossLevel = level;
  state = STATE.OVER; overAt = performance.now(); shakeT = 0.45;
  SFX.crash();
  burst("feather", player.x, player.y, 18, { color: "#fff", spMax: 0.7, lifeMax: 1.1 });
  burst("feather", player.x, player.y, 10, { color: "#222", spMax: 0.7, lifeMax: 1.1 });
  if (score > best) { best = score; localStorage.setItem("ipcf_best", String(best)); VOICE.play("new_best"); }
  storeGhostIfBest();   // even a crashed run can be a record flight — save the path
}

function consumeShield(x, y) {   // 🛡️ pops, soaks one hit, gives a brief invuln window
  hasShield = false; graceT = Math.max(graceT, 0.9);
  burst("spark", x, y, 20, { color: "#7fd0ff", spMax: 0.9, grav: 0.1, lifeMax: 0.6 });
  addText(player.x, player.y - H * 0.06, "SHIELD!", "#7fd0ff", 1.25);
  shakeT = Math.max(shakeT, 0.25); SFX.smash();
}

function update(dt) {
  const ws = slowT > 0 ? CONFIG.slowScale : 1;     // world time-scale (slow-mo)
  const starRush = starT > 0 ? CONFIG.starSpeedBoost : 1;  // ⭐ speeds the world up while the star is active
  bgX -= (state === STATE.PLAYING ? speed * starRush : CONFIG.startSpeed) * CONFIG.bgScroll * H * dt * ws;
  if (shakeT > 0) shakeT -= dt;
  propAngle += dt * (state === STATE.PLAYING ? 26 : 10);

  updateSky(dt);
  updateAmbient(dt, ws);
  updateParticles(dt);
  for (let i = texts.length - 1; i >= 0; i--) {
    const tx = texts[i]; tx.life -= dt; tx.y -= H * 0.22 * dt;
    if (tx.life <= 0) texts.splice(i, 1);
  }

  if (state === STATE.STORY || state === STATE.READY) {
    player.y = H * 0.45 + Math.sin(performance.now() / 350) * H * 0.02;
    player.angle = Math.sin(performance.now() / 350) * 0.06;
    return;
  }
  if (state !== STATE.PLAYING) return;

  tutorialT = Math.max(0, tutorialT - dt);
  mapT = Math.max(0, mapT - dt);
  nearMissT = Math.max(0, nearMissT - dt);
  if (passed >= 3) tutorialStep = 3;
  else if (passed >= 2) tutorialStep = 2;
  else if (passed >= 1) tutorialStep = 1;

  // power-up timers
  if (starT > 0) { starT -= dt; if (starT <= 0) graceT = CONFIG.starGrace; }  // ⭐ ends → grace window begins
  else if (graceT > 0) graceT -= dt;
  if (magnetT > 0) magnetT -= dt;
  if (slowT > 0) slowT -= dt;
  const inv = starT > 0 || graceT > 0;   // invincible during the star AND its grace tail

  // physics (player is NOT slowed — slow-mo only eases the world)
  // climbAmt merges touch/mouse `holding`, keyboard hold, and gamepad tilt
  // (analog pads get proportional lift; 1 = exactly the old full climb)
  player.vy += lerp(CONFIG.gravity, -CONFIG.lift, climbAmt) * H * dt;
  player.vy -= player.vy * CONFIG.drag * dt;   // air resistance: bleeds off momentum so it glides & floats at the top of each tap
  player.vy = clamp(player.vy, -CONFIG.maxClimb * H, CONFIG.maxFall * H);
  player.y += player.vy * dt;
  player.vx += steerAxis*CONFIG.sideAccel*H*dt;   // steerAxis merges touch buttons + keys + stick
  player.vx -= player.vx*CONFIG.sideDrag*dt;
  player.vx=clamp(player.vx,-CONFIG.maxSide*H,CONFIG.maxSide*H);
  player.x+=player.vx*dt;
  const minPX=W*CONFIG.playerMinX,maxPX=W*CONFIG.playerMaxX;
  if(player.x<minPX){player.x=minPX;player.vx=Math.max(0,player.vx);}
  if(player.x>maxPX){player.x=maxPX;player.vx=Math.min(0,player.vx);}
  const targetAngle = clamp(player.vy / (CONFIG.maxFall * H) * 0.7, -0.5, 0.7);
  player.angle += (targetAngle - player.angle) * Math.min(1, dt * 10);

  // --- Ghost Replay Races: record the flight on the unpaused run clock ---
  // runT is built from the same dt every other system uses, so pausing
  // freezes the pilot AND the ghost, and replays line up frame-for-frame.
  runT += dt;
  if (ghostRun && !ghostRun.beat && score > ghostRun.score) {   // pulled ahead of the ghost mid-flight!
    ghostRun.beat = true;
    addText(player.x, player.y - H * 0.08, "NEW BEST FLIGHT PACE!", "#ffd34d", 1.15);
  }
  if (runT - lastRecT >= GHOST_SAMPLE_DT && ghostRec.length < GHOST_SAMPLE_MAX) {
    lastRecT = runT;   // scheduled off the run clock, so pauses never bunch samples up
    ghostRec.push([Math.round(runT * 1000), Math.round(player.x / W * 1000),
                   Math.round(player.y / H * 1000), Math.round(player.angle * 100)]);
  }

  // emit cloud-puff trail
  trailAcc += dt;
  const drawW = H * CONFIG.playerW, drawH = drawW * (616 / 940);
  if (trailAcc > 0.05) {
    trailAcc = 0;
    particles.push({
      kind: "puff", x: player.x - drawW * 0.42, y: player.y + drawH * 0.12,
      vx: -speed * H * 0.25 * ws * starRush, vy: rand(-0.02, 0.02) * H,
      life: 0.55, max: 0.55, size: H * 0.018, grow: H * 0.05, color: PILOT.trail,
    });
  }

  const worldDx = speed * H * dt * ws * starRush;
  const moveLeft = (arr) => { for (const o of arr) o.x -= worldDx; };
  moveLeft(rings); moveLeft(fish); moveLeft(powerups); moveLeft(gusts); moveLeft(missionItems);

  // player hit radius (used by boss shots; rings compute their own below)
  const phhAll = (drawW * (616 / 940) * CONFIG.hitScale) / 2;

  // ---- boss battle ----
  // Every world's boss arrives on a steady flight timer, so the run to the
  // boss is short and reliable (not gated on how many fish you happened to grab).
  if (!bossActive && !bossBeaten) {
    approachT += dt;
    if (approachT >= worldTime(level)) startBoss(level);
  }
  if (bossActive) {
    bossSupplyCd -= dt;
    if (bossSupplyCd <= 0 && missionItems.filter(i => i.kind === "ice").length < 2) {
      missionItems.push({ x: W + H*.1, y: rand(.22,.78)*H, kind: "ice", p: rand(0,6.28) });
      bossSupplyCd = rand(4.2,6.2);
    }
    updateBoss(dt, ws, phhAll);
    if (state !== STATE.PLAYING) return;   // a boss shot may have ended the run
  }

  // enter the Dusty Hills at the threshold score
  if (arena === 1 && score >= CONFIG.arena2At) {
    arena = 2; banner = "Welcome to the Dusty Hills!"; bannerT = 2.8;
  }

  // drifting ring motion
  const tnow = performance.now() / 1000;
  for (const r of rings) {
    r.cy = r.type === "drift"
      ? clamp(r.baseCy + Math.sin(tnow * r.driftFreq + r.phase) * r.driftAmp, H * 0.18, H * 0.82)
      : r.baseCy;
  }

  // recycle rings; spawn new ones only in arena 1 (variable spacing makes pairs)
  while (rings.length && rings[0].x < -W * 0.35) rings.shift();
  if ((arena === 1 || arena === 3 || arena === 4) && !bossActive) {
    const lastX = rings.length ? rings[rings.length - 1].x : W;
    if (lastX < W + H * nextSpacing) {
      const r = makeRing(lastX + H * nextSpacing);
      rings.push(r);
      attachItems(r);
      // decide spacing to the NEXT ring: occasionally a tight pair
      if (passed >= 16 && !pairNext && Math.random() < 0.16) { pairNext = true; nextSpacing = 0.42; }
      else nextSpacing = CONFIG.ringSpacing;
    }
  }

  // Dusty Hills: spawn gust-cloud slots, always leaving room to weave through
  while (gusts.length && gusts[0].x < -W * 0.2) gusts.shift();
  if (arena === 2 && !bossActive) {
    gustCooldown -= worldDx;
    if (gustCooldown <= 0) {
      const x = W + H * 0.18, y1 = rand(0.15, 0.85);
      gusts.push(makeGust(x, y1));
      if (Math.random() < 0.4) {                   // sometimes a 2nd cloud, big gap kept
        let y2 = y1 + (Math.random() < 0.5 ? -1 : 1) * rand(0.5, 0.65);
        y2 = clamp(y2, 0.12, 0.88);
        if (Math.abs(y2 - y1) > 0.42) gusts.push(makeGust(x + rand(-0.04, 0.04) * H, y2));
      }
      if (Math.random() < 0.7) spawnFishLine(x + H * CONFIG.gustSpacing * 0.5, rand(0.25, 0.75) * H, H * 0.05);
      maybeSpawnPower(x + H * CONFIG.gustSpacing * 0.5, rand(0.25, 0.75) * H);
      gustCooldown = H * CONFIG.gustSpacing;
    }
  }

  // collision geometry
  const ringH = H * CONFIG.ringHeight, ringW = ringH * RING.aspect;
  const holeHalf = (ringH * RING.holeFrac) / 2;
  const phw = (drawW * CONFIG.hitScale) / 2, phh = (drawH * CONFIG.hitScale) / 2;

  // rings are SOLID objects now: only the ring band hurts you (flying clear over
  // or under is safe, like the clouds); you only score by threading the hole.
  const ringHalf = ringH / 2;
  for (const r of rings) {
    if (r.smashed) continue;
    const holeTop = r.cy - holeHalf, holeBot = r.cy + holeHalf;
    const ringTop = r.cy - ringHalf, ringBot = r.cy + ringHalf;

    // crossing the ring's x: award a point ONLY if the penguin went through the hole
    if (!r.scored && r.x < player.x) {
      r.scored = true;
      if (player.y > holeTop && player.y < holeBot) {
        passed++;
        if (passed <= 3) tutorialT = 4.0;
        speed = Math.min(speedCap, speed + CONFIG.speedRamp);
        addScore(1, player.x, player.y - drawH * 0.5);
        const centerError = Math.abs(player.y - r.cy);
        if (centerError < holeHalf * 0.18) {
          perfectStreak++; perfectTotal++;
          addScore(2 + Math.min(perfectStreak, 5), player.x, player.y - drawH*.78);
          addText(player.x, player.y + drawH*.62, perfectStreak > 1 ? `PERFECT x${perfectStreak}` : "PERFECT!", "#ffd34d", 1.25);
          burst("spark", player.x, player.y, 18, { color:"#ffd34d", spMax:.65, grav:.1, lifeMax:.7 });
          haptic(22);
        } else {
          perfectStreak = 0;
          if (centerError > holeHalf*.76) { nearMissT = .55; addText(player.x, player.y, "CLOSE CALL!", "#ff9b45", 1.05); }
        }
        SFX.ring();
        if (arena === 1) checkBiome();
      }
    }

    // hit the solid band (between the ring edge and the hole) = crash
    if (Math.abs(r.x - player.x) < ringW * 0.45 + phw) {
      const pTop = player.y - phh, pBot = player.y + phh;
      const hitUpperBand = pBot > ringTop && pTop < holeTop;   // clipped the top of the ring
      const hitLowerBand = pTop < ringBot && pBot > holeBot;   // clipped the bottom of the ring
      if (hitUpperBand || hitLowerBand) {
        if (inv || hasShield) { if (!inv) consumeShield(r.x, r.cy); r.smashed = true; r.scored = true; smashFx(r.x, r.cy); }
        else { gameOver(); return; }
      }
    }
  }

  // fish: magnet pull + collect
  const magnet = magnetT > 0;
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    if (magnet) {
      const dxp = player.x - f.x, dyp = player.y - f.y, d = Math.hypot(dxp, dyp);
      if (d < H * 0.4 && d > 1) { f.x += (dxp / d) * H * 1.4 * dt; f.y += (dyp / d) * H * 1.4 * dt; }
    }
    if (f.x < -W * 0.1) { fish.splice(i, 1); continue; }
    if (Math.hypot(player.x - f.x, player.y - f.y) < phh + H * 0.03) {
      fish.splice(i, 1);
      const val = FISH_RARE[f.type] || CONFIG.fishValue;
      addScore(val, f.x, f.y);
      const rare = !!FISH_RARE[f.type];
      burst("spark", f.x, f.y, rare ? 12 : 7, { color: rare ? "#7fffd4" : "#ffd34d", spMax: rare ? 0.6 : 0.4, grav: 0.3, lifeMax: 0.5 });
      SFX.fish();
    }
  }

  // boss ice-fish ammo (the only collectible left in this array — grab it to shoot the boss)
  for (let i = missionItems.length - 1; i >= 0; i--) {
    const it = missionItems[i]; it.p += dt * 2.5;
    if (it.x < -W*.12) { missionItems.splice(i,1); continue; }
    if (Math.hypot(player.x-it.x, player.y-it.y) < phh + H*.055) {
      missionItems.splice(i,1);
      bossAmmo = Math.min(CONFIG.ammoCap,bossAmmo+1); addText(it.x,it.y,"ICE FISH +1","#7fd0ff",1.12);
      burst("spark",it.x,it.y,16,{color:"#7fd0ff",spMax:.6,grav:.15,lifeMax:.7});SFX.power();haptic(18);
    }
  }

  // power-ups: collect
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    if (pu.x < -W * 0.1) { powerups.splice(i, 1); continue; }
    if (Math.hypot(player.x - pu.x, player.y - pu.y) < phh + H * 0.05) {
      powerups.splice(i, 1);
      if (pu.type === "star") starT = CONFIG.starTime;
      else if (pu.type === "magnet") magnetT = CONFIG.magnetTime;
      else if (pu.type === "shield") hasShield = true;
      else slowT = CONFIG.slowTime;
      const label = pu.type === "star" ? "SUPER STAR!" : pu.type === "magnet" ? "MAGNET!" : pu.type === "shield" ? "SHIELD!" : "SLOW-MO!";
      burst("spark", pu.x, pu.y, 14, { color: pu.type === "shield" ? "#7fd0ff" : "#aef", spMax: 0.6, grav: 0.2, lifeMax: 0.7 });
      addText(pu.x, pu.y, label, pu.type === "shield" ? "#7fd0ff" : "#aef", 1.1);
      SFX.power();
    }
  }

  // Dino Bob plush: drifts right→left with a lazy sine float; bump him for +25
  if (plush) {
    plush.x -= worldDx * 0.5 + H * 0.055 * dt * ws;   // slower than the world → feels like a lazy floater
    plush.y = plush.baseY + Math.sin(tnow * 1.4 + plush.p) * H * 0.02;
    if (plush.x < -W * 0.15) plush = null;
    else if (Math.hypot(player.x - plush.x, player.y - plush.y) < phh + H * 0.045) {
      score += 25;
      addText(plush.x, plush.y, "+25 DINO!", "#7cffa8", 1.35);
      burst("feather", plush.x, plush.y, 12, { color: "#7cffa8", spMax: 0.55, grav: 0.5, lifeMax: 0.9 });
      burst("spark", plush.x, plush.y, 16, { color: "#ffd34d", spMax: 0.7, grav: 0.2, lifeMax: 0.7 });
      SFX.power(); haptic(30);
      plush = null;
    }
  }

  // gust clouds: bob, score, collide
  for (const g of gusts) {
    g.y = g.baseY + Math.sin(tnow * 1.6 + g.p) * H * 0.03;
    if (!g.scored && g.x < player.x) {
      g.scored = true;
      speed = Math.min(CONFIG.maxSpeed, speed + CONFIG.speedRamp);
      addScore(1, player.x, player.y - drawH * 0.5);
      SFX.ring();
    }
    if (Math.hypot(player.x - g.x, player.y - g.y) < g.r * 0.78 + phh * 0.7) {
      if (inv || hasShield) { if (!inv) consumeShield(g.x, g.y); smashFx(g.x, g.y); g.x = -9999; }
      else { gameOver(); return; }
    }
  }

  // Each world introduces a troublemaker with its own movement personality.
  birdCooldown -= worldDx;
  if (!bossActive && passed >= 8 && birdCooldown <= 0) {
    const world = activeWorld();
    const kinds = ["albatross","balloon","storm","snowball","ufo","seal","storm","ufo"];
    const kind = kinds[world] || "albatross";
    birds.push({ kind, x: W + H * 0.14, y: rand(0.2, 0.8) * H, p: rand(0, 6.28), baseY: 0, near:false });
    birds[birds.length - 1].baseY = birds[birds.length - 1].y;
    birdCooldown = H * rand(1.3, 2.6);
  }
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    const factor = b.kind === "balloon" ? .72 : b.kind === "snowball" ? 1.42 : b.kind === "ufo" ? 1.28 : 1.08;
    const r = H * (b.kind === "seal" ? .06 : b.kind === "storm" ? .058 : b.kind === "balloon" ? .052 : .047);
    b.x -= speed * H * factor * dt * ws * starRush;
    if (b.kind === "storm") b.baseY += clamp(player.y-b.baseY,-H*.12,H*.12)*dt*.32;
    if (b.kind === "snowball") b.baseY += Math.sin(b.p)*H*.045*dt;
    const wave = b.kind === "ufo" ? .11 : b.kind === "seal" ? .07 : .04;
    const freq = b.kind === "ufo" ? 5.2 : b.kind === "balloon" ? 1.4 : 3;
    b.y = b.baseY + Math.sin(tnow * freq + b.p) * H * wave;
    if (b.x < -W * 0.15) { birds.splice(i, 1); continue; }
    const bd = Math.hypot(player.x-b.x,player.y-b.y);
    if (!b.near && b.x < player.x && bd < phh+r+H*.08) { b.near=true; addScore(5,player.x,player.y); addText(player.x,player.y-H*.07,"NEAR MISS!","#ff9b45",1.05); }
    if (bd < phh + r) {
      if (inv || hasShield) { if (!inv) consumeShield(b.x, b.y); birds.splice(i, 1); smashFx(b.x, b.y); }
      else { gameOver(); return; }
    }
  }

  // panicked face when a bullet/part is close or the boss looms near
  let danger = false;
  if (bossActive) {
    if (boss && Math.hypot(player.x - boss.x, player.y - boss.y) < boss.w * 0.55) danger = true;
    if (!danger) for (const sh of shots) { if (Math.hypot(player.x - sh.x, player.y - sh.y) < H * 0.17) { danger = true; break; } }
  }
  if (danger) { if (panicT <= 0 && ASSETS.panic.length) panicIdx = (Math.random() * ASSETS.panic.length) | 0; panicT = 0.45; }
  else if (panicT > 0) panicT -= dt;

  // off the top or bottom
  if (player.y - phh < 0 || player.y + phh > H) {
    player.y = clamp(player.y, phh, H - phh);
    gameOver();
  }
}

function smashFx(x, y) {
  burst("shard", x, y, 12, { color: "#ffd24a", spMax: 0.7, grav: 1.0, lifeMax: 0.8 });
  burst("shard", x, y, 6, { color: "#fff6c8", spMax: 0.7, grav: 1.0, lifeMax: 0.8 });
  addScore(1, x, y);   // route smashes through addScore so they build the combo chain
  SFX.smash();
}

function checkBiome() {
  const idx = Math.floor(passed / CONFIG.biomeLen) % BIOMES.length;
  if (idx !== lastBiome) { lastBiome = idx; banner = BIOMES[idx].name; bannerT = 2.2; mapT = 3.5; }
}

/* =============================== BOSS BATTLE ===========================
   After worldTime(level) seconds of flight the sky turns stormy and the
   world's boss appears. Survive its bolts (and the plane chunks it hurls as
   it gets wrecked) for its duration — or speed things up by firing stocked
   ice fish. Outlast it and it spins down: world cleared. */
function medalFor(sc) {
  return sc >= CONFIG.medalGold ? "gold" : sc >= CONFIG.medalSilver ? "silver" : sc >= CONFIG.medalBronze ? "bronze" : null;
}
/* boss art swaps to damaged -> wrecked as the fight progresses (V6 art) */
function bossDamageImg() {
  if (!boss) return null;
  const frac = clamp(bossT / boss.dur, 0, 1);
  const set = ASSETS.bossDmg[boss.level >= 3 ? 3 : boss.level === 2 ? 2 : 1];
  const pick = frac >= 0.66 ? set[1] : frac >= 0.33 ? set[0] : null;
  return pick && pick.ok ? pick : null;
}
function startBoss(lvl) {
  lvl = lvl || 1;
  bossActive = true; bossPhase = 1; bossT = 0; bossShootCd = 0; bossPartsThrown = 0;
  shots = []; friendlyShots = []; bossAmmo = 0; bossSupplyCd = 2.4;
  rings = []; fish = []; powerups = []; birds = []; gusts = []; missionItems = []; plush = null; // clear the arena
  const segment = lvl === 2, finalBoss = lvl >= 3, big = lvl >= 2;
  const spr=segment?ASSETS.gunDeck:big?ASSETS.boss2:ASSETS.boss;
  const cropFrac = 1;
  const aspect = (spr && spr.ok) ? spr.height / (spr.width*cropFrac) : (big ? 0.668/cropFrac : 0.557);
  const dw = H * (finalBoss ? 1.16 : segment ? .72 : .56);
  const dh = dw * aspect;
  // Boss two begins just beyond the right edge, then glides into its lane.
  // This leaves the player a readable, empty escape corridor on arrival.
  const sx = big ? W + dw*.45 : W*.68, roamX = W * (finalBoss ? .83 : segment ? .87 : .68), sy = H * (finalBoss ? .42 : segment ? .40 : .32);
  boss = { x: sx, y: -dh, baseY: sy, roamCx: roamX, roamCy: sy, w: dw, h: dh,
           vy: 0, angle: 0, bob: rand(0, 6.28),
           enterT: finalBoss ? 4.0 : segment ? CONFIG.boss2EntryTime : 1.6,
           firstShotDelay: finalBoss ? 3.8 : segment ? CONFIG.boss2FirstShot : .9,
           charging: false, chargeT: 0, aimX: 0, aimY: 0, smoke: 0,
           level: lvl, dur: finalBoss ? CONFIG.bossDuration+12 : segment ? CONFIG.bossDuration+3 : CONFIG.bossDuration,
           tele: finalBoss ? .70 : segment ? .84 : .72, cadence: finalBoss ? 1.0 : segment ? 1.16 : 1.30,
           sprite: spr, pipe: !big, segment, finalBoss, cropFrac,
           muzX: finalBoss ? -.42 : segment ? -.34 : -.24, muzY: finalBoss ? .08 : segment ? .04 : -.18,
           muzRx: finalBoss ? .05 : segment ? .08 : .055, muzRy: finalBoss ? .07 : segment ? .13 : .11 };
  banner = finalBoss ? "THE FULL DREADNOUGHT ARRIVES!" : segment ? "THE GUN DECK BLOCKS THE WAY!" : "WARNING — THE GUN DROPS DOWN!"; bannerT = 3.6;
  shakeT = 0.9; SFX.alarm();
  VOICE.play("boss_here");   // Lachlan warns the tower: the boss is here!
}
function bossMuzzle() {   // the firing bore, measured from whichever sprite this boss uses
  return { x: boss.x + boss.w * boss.muzX, y: boss.y + boss.h * boss.muzY };
}
function bossWin() {
  const lvl = boss ? boss.level : level;
  bossActive = false; bossPhase = 0; boss = null; shots = [];
  score += 1000 * lvl; addText(W * 0.5, H * 0.42, "+" + (1000 * lvl), "#ffd34d", 1.7);
  shakeT = 0.5; SFX.power();
  // Any boss down = that world is CLEARED. Celebrate, save progress,
  // and send the pilot back to the world select with the next world open.
  bossBeaten = true; overAt = performance.now(); state = STATE.WIN;
  worldsCleared = Math.max(worldsCleared, lvl);
  localStorage.setItem("ipcf_worlds", String(worldsCleared));
  if (score > best) { best = score; localStorage.setItem("ipcf_best", String(best)); }
  storeGhostIfBest();   // victory laps count too — save the winning path
  VOICE.play("boss_down");                                  // "boss down!" right on the kill
  setTimeout(() => VOICE.play("world_clear"), 1400);        // then the world-clear cheer a beat later
}
function throwPart() {   // a chunk of the cruiser breaks off and flies at the penguin
  bossPartsThrown++;
  const ox = boss.x + rand(-0.3, 0.3) * boss.w, oy = boss.y + rand(-0.2, 0.2) * boss.h;
  let dx = player.x - ox, dy = player.y - oy; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  const sp = H * rand(0.34, 0.5);
  shots.push({ x: ox, y: oy, vx: dx * sp, vy: dy * sp, r: H * 0.05, kind: "part",
               part: (Math.random() * ASSETS.parts.length) | 0, rot: 0, spin: rand(-5, 5) });

function updateSky(dt) {
  const k = Math.min(1, dt * 1.5);
  let wash, dark, star, snow, dust;
  if (bossActive) {                               // boss fight: stormy, ominous sky
    wash = [60, 14, 34, 0.55]; dark = 0.34; star = 0; snow = 0; dust = 0;
  } else if (arena === 4) {                       // Level 3: the Dreadnought Approach
    wash = [18, 15, 58, 0.72]; dark = 0.40; star = 1; snow = 0; dust = 0;
  } else if (arena === 3) {                       // Level 2: the Storm Front
    wash = [40, 30, 72, 0.5]; dark = 0.30; star = 1; snow = 0; dust = 0;
  } else if (arena === 2) {                       // Dusty Hills overrides the sky cycle
    wash = DUSTY.wash; dark = DUSTY.dark; star = 0; snow = 0; dust = 1;
  } else {
    const b = BIOMES[(state === STATE.PLAYING ? Math.floor(passed / CONFIG.biomeLen) : 0) % BIOMES.length];
    wash = b.wash; dark = b.dark; star = b.star; snow = b.snow; dust = 0;
  }
  for (let i = 0; i < 4; i++) washCur[i] = lerp(washCur[i], wash[i], k);
  darkCur = lerp(darkCur, dark, k);
  starAmt = lerp(starAmt, star, k);
  snowAmt = lerp(snowAmt, snow, k);
  dustAmt = lerp(dustAmt, dust, k);

}

  if (snowAmt > 0.01) for (const f of flakes) {
    f.x -= drift * 0.25 - f.vx * H * dt; f.y += f.vy * H * dt; f.p += dt * 2;
    if (f.y > H) { f.y = -10; f.x = rand(0, W); }

  if (dustAmt > 0.01) for (const f of flakes) {   // dust drifts mostly sideways
    f.x -= drift * 0.5; f.y += Math.sin(f.p) * H * 0.01 * dt * 60; f.p += dt * 1.5;

function updateParticles(dt) {

function drawPlayer() {

/* ------------------------- Ghost Replay Races --------------------------
   update() does the recording; these helpers store, load, race and draw it.
   One ghost per world, kept in localStorage as:
     ipcf_ghost_w<n> = { score, date, samples:[[tMs, x‰W, y‰H, pitch·100], ...] }
----------------------------------------------------------------------- */
function ghostKey(w) { return "ipcf_ghost_w" + w; }
function loadGhost(w) {   // missing or corrupt JSON just reads as "no ghost here"
  try {
    const d = JSON.parse(localStorage.getItem(ghostKey(w)) || "null");
    if (d && typeof d.score === "number" && Array.isArray(d.samples) && d.samples.length > 1) return d;
  } catch (e) {}
  return null;
}
function cachedGhost(w) {   // read storage once per world, then trust the cache
  if (!(w in ghostStored)) ghostStored[w] = loadGhost(w);
  return ghostStored[w];
}
function storeGhostIfBest() {   // called from gameOver() AND bossWin()
  if (ghostRec.length < 2) return;                // too short to be worth replaying
  const prev = loadGhost(currentWorld);
  if (prev && prev.score >= score) return;        // the old ghost keeps the crown
  const data = { score, date: new Date().toISOString().slice(0, 10), samples: ghostRec };
  try { localStorage.setItem(ghostKey(currentWorld), JSON.stringify(data)); ghostStored[currentWorld] = data; }
  catch (e) {}                                    // storage full → skip the save, keep the fun
}
function raceGhostStart() {   // RACE MY GHOST: relaunch this world with the ghost riding along
  audioInit();
  racePending = true;                            // reset() (just below) picks it up
  const w = currentWorld;
  reset(); applyWorldConfig(w);
  state = STATE.PLAYING; holding = true;
  SFX.flap();
}
/* ---- game-over screen row: BEST FLIGHT label + [RACE MY GHOST] [CLEAR] ---- */
function ghostRowRects() {
  const h = Math.max(44, H * 0.062);
  const rw = Math.min(W * 0.36, H * 0.56), cw = Math.min(W * 0.22, H * 0.38), gap = W * 0.028;
  const x0 = (W - (rw + gap + cw)) / 2, y = H * 0.775;

}
function ghostButtonsHit(px, py) {   // returns true when the tap belonged to the ghost row
  if (diedAtBoss || !cachedGhost(currentWorld)) return false;
  const r = ghostRowRects(), pad = sHitPad();
  const inB = (b) => px >= b.x - pad && px <= b.x + b.w + pad && py >= b.y - pad && py <= b.y + b.h + pad;
  if (inB(r.clear)) {   // double-tap confirm: first tap arms, second tap (within 2.5s) deletes
    if (performance.now() - ghostClearArmedAt < 2500) {
      try { localStorage.removeItem(ghostKey(currentWorld)); } catch (e) {}
      ghostStored[currentWorld] = null; ghostClearArmedAt = 0;
      texts.push({ x: W / 2, y: H * 0.30, str: "Ghost cleared!", color: "#9fb6d8", scale: 1, life: 1.6, max: 1.6 });
    } else {
      ghostClearArmedAt = performance.now();
      texts.push({ x: W / 2, y: H * 0.30, str: "Tap CLEAR again to delete", color: "#ff8a6b", scale: 1, life: 1.8, max: 1.8 });
    }
    return true;
  }

  return false;
}
function drawGhostRow() {   // regular game-over only; the boss-retry screen has its own big button
  if (state !== STATE.OVER || diedAtBoss) return;
  const g = cachedGhost(currentWorld);
  if (!g) return;
  const r = ghostRowRects(), armed = performance.now() - ghostClearArmedAt < 2500;
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(2, H * 0.006); ctx.strokeStyle = "rgba(0,0,0,0.55)";

function ghostPose() {   // interpolate the samples at the shared run clock (advancing pointer)

/* ---------------------- Photo Mode + Share Card ------------------------
   The camera: enter from the pause overlay, drag to pan (±80 px), cycle
   the zoom, then SHUTTER composes a share card from the live canvas.
   exitPhotoMode() is the single way out — keyboard Esc/P, gamepad Start,
   blur/visibility and the on-screen EXIT all land here, so nothing leaks
   frames or handlers no matter how often you hop in and out. */
function enterPhotoMode() {
  if (!paused || photoMode) return;      // only meaningful from the pause overlay
  photoMode = true;
  photoPan.x = 0; photoPan.y = 0;
  photoZoomIdx = 0; photoDragId = null; photoDragLast = null; photoFlashT = 0;
  last = performance.now();              // fresh dt so nothing time-jumps on resume
  requestFrame();                        // wake the loop back up while staying paused
}
function exitPhotoMode() {
  if (!photoMode) return;
  photoMode = false;
  photoZoomIdx = 0; photoPan.x = 0; photoPan.y = 0;   // restore the exact pre-photo view
  photoDragId = null; photoDragLast = null; photoFlashT = 0;
  cancelFrame();                         // hand rendering back to the static pause overlay
  drawPauseOverlay();
}
function cyclePhotoZoom(dir) {
  photoZoomIdx = (photoZoomIdx + dir + PHOTO_ZOOMS.length) % PHOTO_ZOOMS.length;
  haptic(12);
}
function photoWorldName() { return (WORLD_INFO[level] || WORLD_INFO[1]).name; }

/* --- photo bar layout + hit tests (bottom strip, HUD drawing conventions) --- */
function photoShutterPos() { return { x: W / 2, y: H - Math.max(52, H * 0.095), r: Math.max(30, H * 0.055) }; }
function photoZoomPos(side) {
  const s = photoShutterPos(), r = Math.max(22, H * 0.042);
  return { x: s.x + side * (s.r + r * 2.1), y: s.y, r };
}
function photoExitPos() { const r = Math.max(24, H * 0.046); return { x: W - r - Math.max(18, H * 0.05), y: H - Math.max(52, H * 0.095), r }; }
function photoCircleHit(px, py, p) { return px != null && Math.hypot(px - p.x, py - p.y) <= p.r * 1.35; }
function photoPress(px, py) {
  if (photoCircleHit(px, py, photoExitPos())) { exitPhotoMode(); return; }
  if (photoCircleHit(px, py, photoShutterPos())) { takePhoto(); return; }
  if (photoCircleHit(px, py, photoZoomPos(-1))) { cyclePhotoZoom(-1); return; }
  if (photoCircleHit(px, py, photoZoomPos(1))) { cyclePhotoZoom(1); return; }
}
/* Pan = drag anywhere. Listeners attach once at load and self-noop unless
   photo mode is live, so entering/exiting never leaks handlers. */
canvas.addEventListener("pointerdown", (e) => {
  if (!photoMode || photoDragId != null) return;
  photoDragId = e.pointerId;
  photoDragLast = { x: e.clientX, y: e.clientY };
});
window.addEventListener("pointermove", (e) => {
  if (!photoMode || e.pointerId !== photoDragId || !photoDragLast) return;
  photoPan.x = clamp(photoPan.x + (e.clientX - photoDragLast.x), -80, 80);
  photoPan.y = clamp(photoPan.y + (e.clientY - photoDragLast.y), -80, 80);
  photoDragLast = { x: e.clientX, y: e.clientY };
});
window.addEventListener("pointerup", (e) => { if (e.pointerId === photoDragId) { photoDragId = null; photoDragLast = null; } });
window.addEventListener("pointercancel", (e) => { if (e.pointerId === photoDragId) { photoDragId = null; photoDragLast = null; } });

function drawPhotoCircle(p, fill, strong) {
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.16, 0, Math.PI * 2); ctx.fillStyle = "rgba(246,251,255,.22)"; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = fill || "#102a56"; ctx.fill();
  ctx.strokeStyle = strong ? "#f6fbff" : "rgba(246,251,255,.6)";
  ctx.lineWidth = strong ? Math.max(3, p.r * 0.09) : Math.max(2, p.r * 0.08);
  ctx.stroke();
}
function drawPhotoBar() {
  const bh = Math.max(92, H * 0.17);
  ctx.save();
  ctx.fillStyle = "rgba(16,42,86,.84)"; ctx.fillRect(0, H - bh, W, bh);
  ctx.fillStyle = "rgba(255,211,77,.55)"; ctx.fillRect(0, H - bh, W, Math.max(2, H * 0.005));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const s = photoShutterPos(), zm = photoZoomPos(-1), zp = photoZoomPos(1), ex = photoExitPos();
  // shutter: big aurora-gold button with a white lens ring
  drawPhotoCircle(s, "#ffd34d", true);
  ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = Math.max(3, s.r * 0.11);
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.55, 0, Math.PI * 2); ctx.stroke();
  // zoom pair + exit
  drawPhotoCircle(zm); drawPhotoCircle(zp); drawPhotoCircle(ex);
  ctx.fillStyle = "#f6fbff";
  ctx.font = `900 ${Math.round(zm.r * 1.15)}px -apple-system,system-ui,sans-serif`;
  ctx.fillText("\u2212", zm.x, zm.y + zm.r * 0.08);
  ctx.fillText("+", zp.x, zp.y + zp.r * 0.06);
  ctx.font = `800 ${Math.round(ex.r * 0.62)}px -apple-system,system-ui,sans-serif`;
  ctx.fillText("EXIT", ex.x, ex.y + 1);
  // tiny labels under each control
  ctx.fillStyle = "rgba(246,251,255,.75)";
  ctx.font = `700 ${Math.round(Math.max(10, H * 0.02))}px -apple-system,system-ui,sans-serif`;
  ctx.fillText("ZOOM \u2212", zm.x, zm.y + zm.r + H * 0.032);
  ctx.fillText("SHUTTER", s.x, s.y + s.r + H * 0.032);
  ctx.fillText("ZOOM +", zp.x, zp.y + zp.r + H * 0.032);
  ctx.fillText("EXIT", ex.x, ex.y + ex.r + H * 0.032);
  // current zoom readout, left end of the bar (mirrors EXIT on the right)
  ctx.fillStyle = "#ffd34d";
  ctx.font = `900 ${Math.round(Math.max(13, H * 0.028))}px -apple-system,system-ui,sans-serif`;
  ctx.fillText(PHOTO_ZOOMS[photoZoomIdx].toFixed(2) + "\u00d7", Math.max(64, H * 0.15), s.y);
  // toast feedback ("Saved!" / "Shared!") — lives here because the world's
  // floating texts are frozen while the camera is open
  if (photoToast && performance.now() < photoToast.until) {
    ctx.fillStyle = "#ffd34d";
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = Math.max(3, H * 0.008);
    ctx.font = `900 ${Math.round(H * 0.045)}px -apple-system,system-ui,sans-serif`;
    ctx.strokeText(photoToast.str, W / 2, H - bh - H * 0.06);
    ctx.fillText(photoToast.str, W / 2, H - bh - H * 0.06);
  } else photoToast = null;
  ctx.restore();
}

/* --- SHUTTER: compose the share card offscreen --------------------------
   Snapshot source rect is in BACKING pixels (canvas.width/height already
   include the DPR cap), then pasted into a rounded midnight-navy frame
   with aurora-gold accents per ART_DIRECTION.md. */
function rrOn(c, x, y, w, h, r) {   // roundRect() twin for offscreen contexts
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function buildShareCard(src) {
  const sw = src.width, sh = src.height;                 // backing-store pixels (DPR included)
  const cardW = 1080, pad = Math.round(cardW * 0.055);
  const shotW = Math.round(cardW * 0.89);
  const shotH = Math.round(shotW / (sw / sh));
  const capH = Math.round(cardW * 0.235);
  const cardH = pad + shotH + capH + Math.round(pad * 0.4);
  const card = document.createElement("canvas");
  card.width = cardW; card.height = cardH;
  const c = card.getContext("2d");
  c.fillStyle = "#102A56"; rrOn(c, 0, 0, cardW, cardH, 36); c.fill();   // midnight navy card
  c.strokeStyle = "#FFD34D"; c.lineWidth = 6;                           // aurora gold trim
  rrOn(c, 12, 12, cardW - 24, cardH - 24, 28); c.stroke();
  const sx = Math.round((cardW - shotW) / 2), sy = pad;
  c.save(); rrOn(c, sx, sy, shotW, shotH, 20); c.clip();
  c.drawImage(src, 0, 0, sw, sh, sx, sy, shotW, shotH);
  c.restore();
  c.strokeStyle = "#FFD34D"; c.lineWidth = 4;
  rrOn(c, sx, sy, shotW, shotH, 20); c.stroke();
  // caption strip
  c.textAlign = "center"; c.textBaseline = "middle";
  let ty = sy + shotH + capH * 0.26;
  c.fillStyle = "#FFD34D";
  c.font = `900 ${Math.round(cardW * 0.048)}px -apple-system,system-ui,sans-serif`;
  c.fillText("IF PENGUINS COULD FLY", cardW / 2, ty);
  ty += capH * 0.27;
  c.fillStyle = "#F6FBFF";
  c.font = `800 ${Math.round(cardW * 0.034)}px -apple-system,system-ui,sans-serif`;
  c.fillText("WORLD " + level + " \u2022 " + photoWorldName() + "  \u2014  SCORE " + score, cardW / 2, ty);
  ty += capH * 0.24;
  c.fillStyle = "rgba(246,251,255,.72)";
  c.font = `600 ${Math.round(cardW * 0.024)}px -apple-system,system-ui,sans-serif`;
  c.fillText(new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + "  \u2022  flown by Lachlan", cardW / 2, ty);
  return card;
}
function toastPhoto(str) { photoToast = { str, until: performance.now() + (reducedMotion ? 1400 : 1900) }; }
function downloadPhoto(blob) {         // final fallback: plain download (blob-URL windows are blocked in PWA)
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "penguins-photo.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toastPhoto("Saved!");
}
function shareCardBlob(blob) {         // Web Share → download. Never throws.
  try {
    const file = new File([blob], "penguins-photo.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: "If Penguins Could Fly",
        text: "Score " + score + " over " + photoWorldName() + "!",
      }).then(() => toastPhoto("Shared!")).catch(() => {});   // user-cancelled share is not an error
      return;
    }
    downloadPhoto(blob);
  } catch (err) {
    try { downloadPhoto(blob); } catch (err2) { toastPhoto("Photo failed"); }
  }
}
function takePhoto() {
  try {
    const card = buildShareCard(canvas);   // reads the live frame synchronously, flash comes after
    if (!reducedMotion) photoFlashT = 0.26;
    haptic(20);
    card.toBlob((blob) => {
      if (!blob) { toastPhoto("Photo failed"); return; }
      shareCardBlob(blob);
    }, "image/png");
  } catch (err) {
    toastPhoto("Photo failed");
  }
}

/* ------------------------------- Loop --------------------------------- */
let last = performance.now();
function frame(now) {
  rafId = 0;
  if (paused && !photoMode) return;   // photo mode keeps drawing while paused
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (isPortrait) {
    photoDragId = null; photoDragLast = null;   // rotated away mid-shot: drop the pan finger
    drawPortraitPrompt();
    requestFrame();
    return;
  }
  // keep audio alive: browsers (or another app grabbing sound) can re-suspend
  // the context mid-game — nudge it back awake every frame so sound recovers
  if (AC && AC.state !== "running" && !muted) AC.resume();
  pollInputs(dt);   // gamepad + keyboard → merged signals (also watches Start/P while in photo mode)
  if (!photoMode) update(dt);   // camera open = world frozen, exactly like the pause guard
  else if (photoFlashT > 0) photoFlashT -= dt;

  ctx.save();
  if (photoMode) ctx.clearRect(0, 0, W, H);   // pan/zoom can reveal past the painted world
  if (shakeT > 0 && !reducedMotion && !photoMode) { const m = shakeT * H * 0.06; ctx.translate(rand(-m, m), rand(-m, m)); }
  if (photoMode) {
    // zoom about screen center, then slide by the clamped pan — wraps every WORLD layer below
    const z = PHOTO_ZOOMS[photoZoomIdx];
    ctx.translate(W / 2 + photoPan.x, H / 2 + photoPan.y);
    ctx.scale(z, z);
    ctx.translate(-W / 2, -H / 2);
  }
  drawBackground();
  drawStars();
  drawDepthHaze();
  drawObjectShadows();
  drawFish();
  drawPowerups();
  drawPlush();
  drawMissionItems();
  drawGusts();
  for (const r of rings) drawRing(r, "left");
  if (bossActive) drawBoss();
  drawGhost();   // translucent rival flies just beneath the real penguin
  drawPlayer();
  drawFriendlyShots();
  for (const r of rings) drawRing(r, "right");
  if (bossActive) drawShots();
  drawBirds();
  drawParticles();
  drawTexts();
  drawSnow();
  drawDust();
  ctx.restore();

  if(nearMissT>0&&!reducedMotion&&!photoMode){ctx.save();ctx.globalAlpha=nearMissT*.5;ctx.strokeStyle="#ff7a45";ctx.lineWidth=H*.035;ctx.strokeRect(0,0,W,H);ctx.restore();}

  if (photoMode) {
    if (photoFlashT > 0) {   // shutter blink (never armed under reduced motion)
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, photoFlashT / 0.26)})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawPhotoBar();
  }
  else if (state === STATE.PLAYING) { drawScore(); drawBossMeter(); drawBossEntrance(); drawBanner(); drawBossHud(); drawFireButton(); drawTutorial(); drawDirectionControls(); if(mapT>0)drawJourneyMap(false); }
  else if (state === STATE.STORY) {
    drawStoryPanel();
  }
  else if (state === STATE.READY) {
    drawTitleScreen();
    drawWhatsNewChip();
    if (whatsNewOpen) drawWhatsNewPanel();
  } else if (state === STATE.WIN) {
    drawScore();
    const foes = { 1: "Captain Albatross's gun", 2: "the Gun Deck", 3: "the mighty Dreadnought" };
    panel(level >= 3 ? "YOU SAVED THE SKIES!" : "WORLD " + level + " CLEARED!", [
      { text: "You beat " + (foes[level] || foes[1]) + "!", color: "#ffd34d", big: true },
      { text: "Score: " + score, big: true },
      { text: "Best: " + best, color: "#ffd34d" },
      { text: level < 3 ? "WORLD " + (level + 1) + " UNLOCKED!" : "Every boss is beaten. Wow!", color: "#7fd0ff" },
      { text: "" },
      { text: "Tap to fly again" },
    ]);
    drawMissionSprite("festival",W*.82,H*.25,H*.24,-.08);
    if (ASSETS.victory && ASSETS.victory.ok) {
      const vw = H * 0.34, vh = vw * (ASSETS.victory.height / ASSETS.victory.width);
      ctx.drawImage(ASSETS.victory, W * 0.16 - vw / 2, H * 0.16, vw, vh);
    }
  } else if (state === STATE.OVER) {
    drawScore();
    panel("Game Over", [
      { text: "Score: " + score, big: true },
      { text: "Best: " + best, color: "#ffd34d" },
      { text: "" },
      { text: diedAtBoss ? "Your boss checkpoint is saved" : "Tap to play again", color: diedAtBoss ? "#ff8a3d" : "#fff" },
      { text: "" },
    ]);
    const med = medalFor(score);
    if (med) {
      const mimg = ASSETS.medals[med];
      if (mimg && mimg.ok) {
        const ms = H * 0.2, mh = ms * (mimg.height / mimg.width);
        ctx.drawImage(mimg, W * 0.82 - ms / 2, H * 0.2, ms, mh);
        ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = med === "gold" ? "#ffd34d" : med === "silver" ? "#e8eef6" : "#e0995a";
        ctx.font = `900 ${Math.round(H*0.032)}px -apple-system, system-ui, sans-serif`;
        ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = Math.max(2, H*0.005);
        const label = med.toUpperCase() + " MEDAL!";
        ctx.strokeText(label, W * 0.82, H * 0.2 + mh + H * 0.03);
        ctx.fillText(label, W * 0.82, H * 0.2 + mh + H * 0.03);
        ctx.restore();
      }
    }
    if(diedAtBoss)drawContinueBossButton();
    drawGhostRow();   // "BEST FLIGHT" + RACE MY GHOST / CLEAR (only when a ghost is saved)
  }
  requestFrame();
}

resize();
reset();
requestFrame();
window.addEventListener("blur", () => { if (state === STATE.PLAYING) { exitPhotoMode(); setPaused(true); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === STATE.PLAYING) { exitPhotoMode(); setPaused(true); } });

/* What's New panel scrolling: mouse wheel + touch/pointer drag, both clamped
   to the content height measured by the last draw. */
canvas.addEventListener("wheel", (e) => {
  if (!whatsNewOpen) return;
  e.preventDefault();
  whatsNewScroll = clamp(whatsNewScroll + e.deltaY, 0, whatsNewScrollMax);
}, { passive: false });
canvas.addEventListener("pointerdown", (e) => {
  if (whatsNewOpen && state === STATE.READY) whatsNewDragY = e.clientY - whatsNewScroll;
});
window.addEventListener("pointermove", (e) => {
  if (whatsNewDragY != null) whatsNewScroll = clamp(e.clientY - whatsNewDragY, 0, whatsNewScrollMax);
});
window.addEventListener("pointerup", () => { whatsNewDragY = null; });
window.addEventListener("pointercancel", () => { whatsNewDragY = null; });

/* ---- PWA: offline play once installed (no-op when opened as a file) ---- */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
}
</script>
</body>
